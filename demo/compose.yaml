name: container-hub-demo

services:
  demo-web:
    image: nginx:stable-alpine
    restart: unless-stopped

    ports:
      - "127.0.0.1:8081:80"

    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
